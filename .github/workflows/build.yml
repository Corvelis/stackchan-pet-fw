name: PlatformIO Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platformio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  face-assets:
    name: Face asset validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Reject developer-local absolute paths
        run: python scripts/check_no_local_paths.py

      - name: Require Japanese and English documentation pairs
        run: python scripts/check_bilingual_docs.py --base "${{ github.event.pull_request.base.sha }}"

      - name: Install face asset tool dependency
        run: python -m pip install "Pillow>=10.0"

      - name: Run face asset validator tests
        run: python -m unittest discover -s scripts/tests -p "test_*.py" -v

      - name: Validate runtime face assets
        run: python scripts/validate_face_assets.py

  build:
    name: ${{ matrix.environment }}
    runs-on: ubuntu-latest
    needs: face-assets
    strategy:
      fail-fast: false
      matrix:
        environment:
          - m5stack-cores3
          - m5stack-cores3-classic
          - m5stack-stopwatch
          - m5stack-stopwatch-classic
          - m5stack-atoms3r-chatbot
          - m5stack-atoms3r-chatbot-classic

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache PlatformIO downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core
        run: python -m pip install platformio==6.1.19

      - name: Build firmware
        run: pio run -e "${{ matrix.environment }}"
